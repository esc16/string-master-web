<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Master - Weekly Report</title>
  <style>
    :root {
      --primary: #c5ff2a; /* Match the app's neon green */
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #ffffff;
      --text-secondary: #aaaaaa;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      background-color: var(--surface);
      padding: 40px;
      border-radius: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .logo {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #000;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 100px;
      font-weight: bold;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    /* Try to force app open using custom scheme fallback if JS fails */
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎾</div>
    <h1>View Your Report</h1>
    <p>To view your detailed weekly report, please open this link on your mobile device where the String Master app is installed.</p>
    
    <!-- We can also add a script to try deep linking or fallback to stores -->
    <script>
      function tryOpenApp() {
        var isAndroid = /Android/i.test(navigator.userAgent);
        
        if (isAndroid) {
          // Chrome on Android requires the intent:// syntax to reliably launch apps
          window.location.href = "intent://tennisstringmaster.com/reports#Intent;scheme=stringmaster;package=com.dragons.tennis_string_master;end";
        } else {
          // iOS and others
          window.location.href = "stringmaster://tennisstringmaster.com/reports";
          
          // Fallback redirect if app is not installed (iOS)
          setTimeout(() => {
            window.location.href = "/";
          }, 2000);
        }
      }
    </script>

    <a href="#" class="btn" onclick="tryOpenApp(); return false;">Open App</a>
  </div>
</body>
</html>
