<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: white; font-family: monospace; padding: 20px; word-break: break-all; }
        .log-box { border: 1px solid #333; background: #1E1E1E; padding: 15px; margin-top: 10px; min-height: 200px; white-space: pre-wrap; font-size: 14px; }
        h3 { color: #CCFF00; margin-top: 0; }
        .error { color: #ff6b6b; font-weight: bold; }
        .success { color: #69db7c; font-weight: bold; }
        input { padding: 10px; width: 80%; background: #333; border: 1px solid #555; color: white; }
        button { padding: 10px 20px; background: #CCFF00; color: black; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h3>🕵️‍♂️ Step-by-Step Debugger (Fixed)</h3>
    <p>아래 로그를 확인하세요.</p>

    <div id="logs" class="log-box">Waiting for logs...</div>

    <div id="form-container" style="display:none; margin-top:20px; border-top:2px solid #CCFF00; padding-top:20px;">
        <h3>✅ 비밀번호 변경 폼 (연결 성공)</h3>
        <input type="password" id="password" placeholder="New Password"><br>
        <button onclick="doUpdate()">Change Password</button>
    </div>

    <script>
        // 1. 로그 출력 함수
        function log(msg, type = 'info') {
            const logBox = document.getElementById('logs');
            const color = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#69db7c' : '#ccc');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
        }

        // 2. 에러 캐치
        window.onerror = function(msg, url, line) {
            log(`💥 CRITICAL JS ERROR: ${msg} (Line: ${line})`, 'error');
            return false;
        };

        const supabaseUrl = 'https://ngdivxnbvvsoxfgdaytr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGl2eG5idnZzb3hmZ2RheXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTkxMjYsImV4cCI6MjA4MjM5NTEyNn0.0fl6SoLKAfmK_Quetm2Sk6Klkd7W9JRmyq8MBpSKInU';
        
        // ⚠️ [수정됨] 변수 이름을 '_supabase'로 변경하여 라이브러리 이름 충돌 방지
        let _supabase;

        async function init() {
            log("🚀 Script started.");

            try {
                // 전역 객체 'supabase'를 사용하여 클라이언트 생성
                _supabase = supabase.createClient(supabaseUrl, supabaseKey);
                log("✅ Supabase Client initialized.");
            } catch (e) {
                log(`❌ Supabase Init Failed: ${e.message}`, 'error');
                log(`💡 힌트: 스크립트 로딩 문제이거나 변수명 충돌일 수 있습니다.`, 'error');
                return;
            }

            // 파라미터 확인
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const hash = window.location.hash;

            log(`🔎 Checking Params...`);
            log(`- Code (PKCE): ${code ? code.substring(0, 10) + '...' : 'NONE'}`);
            log(`- Hash (Fragment): ${hash ? 'Found' : 'NONE'}`);

            if (code) {
                log("🔄 Found PKCE code. Attempting exchangeCodeForSession...");
                try {
                    // _supabase 변수 사용
                    const { data, error } = await _supabase.auth.exchangeCodeForSession(code);
                    if (error) {
                        log(`❌ Exchange Error: ${error.message}`, 'error');
                        log(`👉 힌트: 링크가 만료되었거나 이미 사용된 코드입니다. 앱에서 다시 요청하세요.`, 'error');
                    } else {
                        log(`✅ Session Exchanged! User: ${data.user?.email}`, 'success');
                        showForm();
                    }
                } catch (err) {
                    log(`💥 Exchange Exception: ${err.message}`, 'error');
                }
            } else if (hash && hash.includes('access_token')) {
                log("🔄 Found Hash token. Verifying session...");
                // _supabase 변수 사용
                const { data: { session }, error } = await _supabase.auth.getSession();
                if (session) {
                    log(`✅ Session Valid! User: ${session.user?.email}`, 'success');
                    showForm();
                } else {
                    log(`⚠️ Hash found but no session. (Check console)`, 'error');
                }
            } else {
                log("❌ No code or hash found in URL.", 'error');
                log("👉 이메일 링크를 다시 클릭해보세요.");
            }
        }

        function showForm() {
            document.getElementById('form-container').style.display = 'block';
            log("🔓 Unlocked password form.", 'success');
        }

        async function doUpdate() {
            const password = document.getElementById('password').value;
            if(!password) return alert("비밀번호를 입력하세요");

            log("🔄 Updating password...");
            // _supabase 변수 사용
            const { error } = await _supabase.auth.updateUser({ password: password });
            
            if (error) log(`❌ Update Failed: ${error.message}`, 'error');
            else {
                log("🎉 Password updated successfully!", 'success');
                alert("비밀번호가 변경되었습니다!");
            }
        }

        init();
    </script>
</body>
</html>
