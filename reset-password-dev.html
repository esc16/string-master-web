<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Debug</title>
    <style>
        body { background: #121212; color: #00FF00; font-family: monospace; padding: 20px; font-size: 1.2rem; }
        .box { border: 1px solid #444; padding: 15px; margin-bottom: 20px; word-break: break-all; }
        h3 { color: #CCFF00; margin-top: 0; }
    </style>
</head>
<body>
    <h1>🐞 Simple URL Checker</h1>

    <div class="box">
        <h3>1. Current URL</h3>
        <div id="url">Reading...</div>
    </div>

    <div class="box">
        <h3>2. Parameters Found</h3>
        <div id="params">Reading...</div>
    </div>

    <script>
        // 에러 발생 시 화면에 표시
        window.onerror = function(msg, url, line) {
            document.body.innerHTML += `<div style="color:red; border:1px solid red; padding:10px;">💥 JS Error: ${msg} (Line ${line})</div>`;
        };

        // 1. URL 출력
        document.getElementById('url').innerText = window.location.href;

        // 2. 파라미터 분석 (Supabase 없이 순수 JS로)
        const output = document.getElementById('params');
        const search = window.location.search; // ?code=...
        const hash = window.location.hash;     // #access_token=...
        
        const urlParams = new URLSearchParams(search);
        const code = urlParams.get('code');
        
        let msg = "";

        if (code) {
            msg += `✅ <b>PKCE CODE found:</b> <br>${code}<br><br>`;
            msg += `👉 이 코드가 보이면 리다이렉트는 성공입니다!`;
        } else if (hash) {
            msg += `✅ <b>HASH found:</b> <br>${hash}<br>`;
        } else {
            msg += `❌ <b>No Code or Hash found!</b><br>URL에 토큰이 없습니다.`;
        }

        output.innerHTML = msg;
    </script>
</body>
</html>
