<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - String Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #CCFF00;
            --bg: #121212;
            --surface: #1E1E1E;
            --text: #FFFFFF;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
            text-align: center;
        }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2C2C2C;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 1rem;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #message { margin-top: 20px; color: #AAA; font-size: 0.9rem; }
        .error { color: #ff6b6b !important; }
        .success { color: #69db7c !important; }
        .loading { color: #CCFF00; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        
        <div id="loading-container">
            <p class="loading">Verifying link...</p>
        </div>

        <div id="form-container" style="display: none;">
            <p style="color: #ccc; margin-bottom: 20px;">Enter your new password below.</p>
            <input type="password" id="password" placeholder="New Password (min 6 chars)">
            <input type="password" id="confirm_password" placeholder="Confirm New Password">
            <button onclick="updatePassword()" id="btn">Update Password</button>
        </div>

        <div id="success-container" style="display: none;">
            <p class="success">✅ Password changed successfully!</p>
            <p style="color:#ccc; margin-top:10px;">You can now close this window and log in to the app.</p>
        </div>

        <p id="message"></p>
    </div>

    <script>
        // ⚠️ [필수 수정] 따옴표('')를 절대 지우지 마세요!
        const supabaseUrl = 'https://ngdivxnbvvsoxfgdaytr.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGl2eG5idnZzb3hmZ2RheXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTkxMjYsImV4cCI6MjA4MjM5NTEyNn0.0fl6SoLKAfmK_Quetm2Sk6Klkd7W9JRmyq8MBpSKInU';
        
        let supabase;

        // 1. 초기화 및 세션 복구 시작
        async function init() {
            try {
                supabase = supabase.createClient(supabaseUrl, supabaseKey);
                
                // URL에서 파라미터 확인
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const hash = window.location.hash;

                if (code) {
                    // PKCE 코드(Code)가 있으면 세션으로 교환
                    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                    showForm();
                } else if (hash && (hash.includes('access_token') || hash.includes('type=recovery'))) {
                    // 해시(Hash)가 있으면 자동 로그인됨 (onAuthStateChange가 처리)
                    showForm();
                } else {
                    // 아무것도 없으면 잘못된 접근 -> 홈으로
                    window.location.replace('index.html');
                }

                // (보조) 인증 상태 변화 감지
                supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'PASSWORD_RECOVERY' || session) {
                        showForm();
                    }
                });

            } catch (e) {
                document.getElementById('loading-container').style.display = 'none';
                document.getElementById('message').innerText = "Link expired or invalid.";
                document.getElementById('message').className = "error";
            }
        }

        // 폼 보여주기 함수
        function showForm() {
            document.getElementById('loading-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        }

        // 2. 비밀번호 업데이트 로직
        async function updatePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const btn = document.getElementById('btn');
            const msg = document.getElementById('message');

            if (password.length < 6) {
                msg.innerText = "Password must be at least 6 characters.";
                msg.className = "error";
                return;
            }

            if (password !== confirmPassword) {
                msg.innerText = "Passwords do not match.";
                msg.className = "error";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";
            msg.innerText = "";

            const { data, error } = await supabase.auth.updateUser({
                password: password
            });

            if (error) {
                msg.innerText = "Error: " + error.message;
                msg.className = "error";
                btn.disabled = false;
                btn.innerText = "Update Password";
            } else {
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'block';
            }
        }

        // 실행
        init();
    </script>
</body>
</html>
