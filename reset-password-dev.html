<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - String Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #CCFF00;
            --bg: #121212;
            --surface: #1E1E1E;
            --text: #FFFFFF;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            /* 초기엔 숨김 (깜빡임 방지) */
            visibility: hidden; 
        }
        .card {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
            text-align: center;
        }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2C2C2C;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 1rem;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #message { margin-top: 20px; color: #AAA; font-size: 0.9rem; }
        .error { color: #ff6b6b !important; }
        .success { color: #69db7c !important; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <div id="form-container">
            <p style="color: #ccc; margin-bottom: 20px;">Enter your new password below.</p>
            <input type="password" id="password" placeholder="New Password (min 6 chars)">
            <input type="password" id="confirm_password" placeholder="Confirm New Password">
            <button onclick="updatePassword()" id="btn">Update Password</button>
        </div>
        <div id="success-container" style="display: none;">
            <p class="success">✅ Password changed successfully!</p>
            <p style="color:#ccc; margin-top:10px;">You can now close this window and log in to the app.</p>
        </div>
        <p id="message"></p>
    </div>

    <script>
        // ⚠️ [중요] 본인의 Supabase 키 입력
        const supabaseUrl = 'https://ngdivxnbvvsoxfgdaytr.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGl2eG5idnZzb3hmZ2RheXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTkxMjYsImV4cCI6MjA4MjM5NTEyNn0.0fl6SoLKAfmK_Quetm2Sk6Klkd7W9JRmyq8MBpSKInU';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // ✅ [수정됨] URL 체크 로직 개선 (Hash와 Query Param 모두 지원)
        const hash = window.location.hash;
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code'); // ?code=... 값 확인

        // 1. 토큰(#)도 없고, 코드(?)도 없으면 -> 잘못된 접근
        if (!code && (!hash || (!hash.includes('access_token') && !hash.includes('type=recovery')))) {
            // 즉시 홈으로 이동
            window.location.replace('index.html');
        } else {
            // 2. 정상이면 화면 보여주기
            document.body.style.visibility = 'visible';
            
            // ?code= 로 들어온 경우, Supabase 클라이언트가 자동으로 세션을 교환하므로 별도 처리는 불필요
            // 사용자가 비밀번호를 입력하는 동안 백그라운드에서 로그인이 완료됩니다.
        }

        async function updatePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const btn = document.getElementById('btn');
            const msg = document.getElementById('message');

            if (password.length < 6) {
                msg.innerText = "Password must be at least 6 characters.";
                msg.className = "error";
                return;
            }

            if (password !== confirmPassword) {
                msg.innerText = "Passwords do not match.";
                msg.className = "error";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";
            msg.innerText = "";

            const { data, error } = await supabase.auth.updateUser({
                password: password
            });

            if (error) {
                msg.innerText = "Error: " + error.message;
                msg.className = "error";
                btn.disabled = false;
                btn.innerText = "Update Password";
            } else {
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'block';
            }
        }
    </script>
</body>
</html>
