<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG - Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #00FF00; /* 디버그 느낌의 녹색 텍스트 */
            font-family: monospace;
            padding: 20px;
            /* ⚠️ 디버깅을 위해 visibility: hidden 제거함 */
            visibility: visible !important; 
        }
        .debug-box {
            border: 1px solid #333;
            background: #1E1E1E;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            word-break: break-all; /* 긴 토큰 줄바꿈 */
        }
        h2 { color: #CCFF00; margin-top: 0; }
        label { display: block; color: #AAA; margin-top: 10px; font-size: 0.8rem;}
        .value { color: white; font-weight: bold; }
        button {
            padding: 15px 30px;
            background: #CCFF00;
            color: black;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🐞 Debug Mode</h1>
    
    <div class="debug-box">
        <h2>1. URL Parameters Received</h2>
        <div id="debug-info">Analyzing URL...</div>
    </div>

    <div class="debug-box">
        <h2>2. JS / Supabase Logs</h2>
        <div id="log-output" style="color: #ff6b6b;">No errors yet.</div>
    </div>

    <div class="debug-box">
        <h2>3. Manual Test Form</h2>
        <input type="password" id="password" placeholder="New Password" style="padding:10px; width:80%;">
        <button onclick="updatePassword()">Update Password</button>
    </div>

    <script>
        // 🚨 에러 발생 시 화면에 즉시 출력 (Global Error Handler)
        window.onerror = function(message, source, lineno, colno, error) {
            const log = document.getElementById('log-output');
            log.innerHTML += `<br>[CRITICAL ERROR]: ${message} (Line: ${lineno})`;
            return false;
        };

        // ⚠️ [설정] 본인의 Supabase 키 입력 (정확한지 확인!)
        const supabaseUrl = 'https://ngdivxnbvvsoxfgdaytr.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGl2eG5idnZzb3hmZ2RheXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTkxMjYsImV4cCI6MjA4MjM5NTEyNn0.0fl6SoLKAfmK_Quetm2Sk6Klkd7W9JRmyq8MBpSKInU';
        
        let supabase;

        try {
            supabase = supabase.createClient(supabaseUrl, supabaseKey);
            document.getElementById('log-output').innerHTML += "<br>[INFO] Supabase Client Initialized.";
        } catch (e) {
            document.getElementById('log-output').innerHTML += "<br>[ERROR] Supabase Init Failed: " + e.message;
        }

        // ✅ URL 분석 및 화면 출력 로직
        function analyzeUrl() {
            const output = document.getElementById('debug-info');
            const fullUrl = window.location.href;
            const hash = window.location.hash;
            const search = window.location.search;
            const urlParams = new URLSearchParams(search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            const errorDesc = urlParams.get('error_description');

            let html = `
                <label>Full URL:</label><div class="value">${fullUrl}</div>
                <label>Query Params (?):</label><div class="value">${search || "(None)"}</div>
                <label>Hash Params (#):</label><div class="value">${hash || "(None)"}</div>
                <hr style="border-color:#333">
                <label>👉 PKCE 'code':</label><div class="value" style="color:${code ? '#CCFF00' : 'red'}">${code || "MISSING"}</div>
                <label>👉 Error Param:</label><div class="value" style="color:red">${error || "(None)"}</div>
                <label>👉 Error Desc:</label><div class="value" style="color:red">${errorDesc || "(None)"}</div>
            `;

            output.innerHTML = html;

            if (!code && !hash) {
                 document.getElementById('log-output').innerHTML += "<br>[WARNING] No 'code' or '#' found. Link might be invalid or stripped.";
            } else if (code) {
                 document.getElementById('log-output').innerHTML += "<br>[SUCCESS] Found PKCE code! Ready to update.";
            }
        }

        // 페이지 로드 시 즉시 분석 실행
        analyzeUrl();

        // 비밀번호 업데이트 함수
        async function updatePassword() {
            const password = document.getElementById('password').value;
            if (!password) return alert("Enter a password");

            document.getElementById('log-output').innerHTML += "<br>[INFO] Attempting updateUser...";
            
            try {
                // Supabase가 URL의 code/hash를 자동으로 감지해서 세션을 복구하는지 확인
                const { data, error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) {
                    document.getElementById('log-output').innerHTML += `<br>[FAIL] Update Failed: ${error.message}`;
                    console.error(error);
                } else {
                    document.getElementById('log-output').innerHTML += `<br>[SUCCESS] Password Updated! User: ${data.user?.email}`;
                    alert("성공! 비밀번호가 변경되었습니다.");
                }
            } catch (err) {
                 document.getElementById('log-output').innerHTML += `<br>[EXCEPTION] ${err.message}`;
            }
        }
    </script>
</body>
</html>
