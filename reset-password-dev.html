<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - String Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #CCFF00;
            --bg: #121212;
            --surface: #1E1E1E;
            --text: #FFFFFF;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
            text-align: center;
        }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2C2C2C;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 1rem;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #message { margin-top: 20px; color: #AAA; font-size: 0.9rem; }
        .error { color: #ff6b6b !important; }
        .success { color: #69db7c !important; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <div id="form-container">
            <p style="color: #ccc; margin-bottom: 20px;">Enter your new password below.</p>
            
            <input type="password" id="password" placeholder="New Password (min 6 chars)">
            <input type="password" id="confirm_password" placeholder="Confirm New Password">
            
            <button onclick="updatePassword()" id="btn">Update Password</button>
        </div>
        <div id="success-container" style="display: none;">
            <p class="success">✅ Password changed successfully!</p>
            <p style="color:#ccc; margin-top:10px;">You can now close this window and log in to the app.</p>
        </div>
        <p id="message"></p>
    </div>

    <script>
        // ⚠️ [중요] 여기에 본인의 Supabase 키를 입력하세요! (공개되어도 괜찮은 Anon Key입니다)
        const supabaseUrl = 'https://ngdivxnbvvsoxfgdaytr.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGl2eG5idnZzb3hmZ2RheXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTkxMjYsImV4cCI6MjA4MjM5NTEyNn0.0fl6SoLKAfmK_Quetm2Sk6Klkd7W9JRmyq8MBpSKInU';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // URL 해시(#)에서 토큰 파싱
        const hash = window.location.hash;
        
        // 토큰이 없으면 홈으로 튕겨냄 (보안)
        if (!hash || (!hash.includes('access_token') && !hash.includes('type=recovery'))) {
            document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:50px;'>Invalid Link</h1>";
            setTimeout(() => window.location.href = 'index.html', 2000);
        }

        async function updatePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value; // ✅ 확인용 변수
            const btn = document.getElementById('btn');
            const msg = document.getElementById('message');

            // 1. 유효성 검사 (길이)
            if (password.length < 6) {
                msg.innerText = "Password must be at least 6 characters.";
                msg.className = "error";
                return;
            }

            // 2. 유효성 검사 (일치 여부 확인) 🔍
            if (password !== confirmPassword) {
                msg.innerText = "Passwords do not match.";
                msg.className = "error";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";
            msg.innerText = "";

            // 3. 비밀번호 업데이트 요청
            const { data, error } = await supabase.auth.updateUser({
                password: password
            });

            if (error) {
                msg.innerText = "Error: " + error.message;
                msg.className = "error";
                btn.disabled = false;
                btn.innerText = "Update Password";
            } else {
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'block';
            }
        }
    </script>
</body>
</html>
